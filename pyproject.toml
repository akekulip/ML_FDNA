[project]
name = "ml-fdna"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandapower>=3.5.5",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
