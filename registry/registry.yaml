# Locked hypothesis registry for Phase 2 (committed BEFORE any Phase-2 experiment ran).
# Changes after a run starts must go to registry/exploratory.yaml and can never feed a confirmatory claim.
version: 1
seed_blocks:
  train: [0, 99]
  validation: [100, 119]
  inspected_exploratory: [[200, 279], [300, 379]]   # already seen in Phase 1; screening only
  confirm: [400, 479]        # opened once per hypothesis via src/fdna/blocks.py
  replicate: [500, 579]
  reserve: [600, 699]
integrity:
  max_confirmatory_hypotheses: 8
  multiplicity: Holm across declared family; structure claims need intersection-union over controls
  sesoi_rprec: 0.05          # where the best baseline is below 0.85; or 2x sample efficiency; wiring transfer 0.10
  equivalence_bound: 0.02    # TOST
  tuning: nested per (arm, training size), 40 TPE trials, same search-space width; report tuned vs shared spread
  fdna_evaluated_before_v2_freeze: false
v2_observation_model:   # frozen a priori (see prereg/SPEC_V2.md); parameters chosen on physical grounds, not by FDNA results
  p_fail: 0.15
  common_cause_groups: [[GW0, RTU0, RTU1, RTU2, RTU3], [GW1, GW2]]
  p_group: 0.08
  observed_flags: 13        # 10 unit poll-response flags + 3 gateway heartbeats
  missing_prob_q: [0.1, 0.3]
  stale_prob_s: [0.0, 0.2]   # a failed component is reported 'up' with prob s; never the reverse
  report_all_cells: true
hypotheses:
  E1_headroom:            # SCREEN, no FDNA involved
    tier: screen
    claim: exact Bayes posterior-mean predictor beats the best tuned tree (A1 obs, A2 logic-features) on identical observations
    metric: severe (y>0.01) R-precision per test operating point, N-2 outages, mean over operating points
    data: train ops 0-99 (n in {25,100}), val 100-119, test 200-279 (exploratory)
    proceed_if: oracle - best_tree >= 0.03 in at least one cell with q>=0.1 at n=100
    diagnose_if: oracle - best_tree < 0.01 in every cell
  B2_wiring_corruption:   # SCREEN, existing v1 benchmark
    tier: screen
    claim: with 10/20/30% wrong assumed wiring edges, a dependency layer that learns edges from outcomes beats tuned trees on raw flags
    win: A5 - A1 >= 0.05 R-precision at 20% corruption (novel-control-vector N-2 cell), plus edge-recovery F1 reported
    kill: A1 within 0.02 of A5 at every corruption level
  B3_monotone:            # SCREEN
    claim: a monotone-in-control value model beats a monotone-constrained GBM at n<=25 on novel control vectors
    kill: within 0.02
  B1_A5_confirm:          # CONFIRMATORY slot 1 (only if E1 passes and v2 is frozen)
    tier: confirm
    claim: FDNA/belief model A5 beats best of A1-A4 by >= 0.05 R-precision (or 2x fewer samples) and beats A6, A7
    data: confirm block 400-479, all four (q,s) cells reported
  # slots 2-8 reserved for hypotheses promoted from screens; each must be appended here BEFORE its confirm run.
arms:
  A1: tuned GBM on raw observations (missing = NaN) + electrical/physics features
  A2: tuned GBM on deterministic structure-derived features from the observations (lower/upper bounds on commandable fraction per generator)
  A2b: tuned GBM on exact posterior control-fraction marginals (ORACLE-INFORMATION reference, not a competitor)
  A3: MLP on the same inputs as A1
  A4: GNN with min/max aggregation on the dependency graph
  A5: FDNA/belief layer (learnable strengths and criticalities, soft min, learned emission) + value head
  A6: A5 with shuffled dependency edges
  A7: unconstrained layer of identical size
  oracle: exact posterior mean of the value table (Bayes-optimal given the generative model)

variants:   # pre-registered variants after a diagnosed failure (each committed before it runs)
  B3v2_monotone_rescaled:
    parent: B3_monotone
    reason: Branch 3 neural arms scored 0.34-0.58 vs trees 0.70-0.93; diagnosis (scripts/nn_diagnose.py, validation data only) found target scale starved gradients
    change: NN targets multiplied by 100 (fit/predict handle it); nothing else changes; same kill rule (monotone within 0.02 of monotone GBM at n<=25)
  B3_original_status: invalid_training_recipe (not a test of monotonicity); reported as such
outcomes:   # appended after runs; never edited retroactively
  B3v2_monotone_rescaled:
    status: killed_as_hypothesis
    result: nn_monotone is 0.06-0.13 below monotone GBM at n<=25 (novel cell); monotone GBM is ~0.025 below free GBM; monotone prior gives no advantage. Exploratory test block 200-279, 3 reps.
  B2_wiring_corruption:
    status: killed_as_hypothesis
    result: at rho=0.2 (3 corruption seeds, 2 reps, novel N-2 cell) A5 (learned service graph + monotone head) is 0.096-0.159 BELOW A1 (tuned GBM on raw flags); GBM with true wiring (A2t) is not better than GBM on raw flags (0.796 vs 0.806 at n=25), so wiring knowledge gives trees nothing.
    side_finding: A5 beats the generic MLP on raw flags (A3) by +0.014/+0.047/+0.092 at n=10/25/100 (novel cell) despite 20% wrong edges; learning edges beats freezing them by ~0.02 at n=100; unit->generator assignment recovery degrades with data (0.83 -> 0.48) i.e. edges are weakly identifiable from shed outcomes.
    diagnosis: trees already learn the dependency rule from raw flags (v1 Q1), so structure has nothing to add for trees; structure helps neural networks only.
  E1_headroom:
    status: passed_as_registered_but_INVALID_as_inference_headroom_measure
    result: oracle - best(A1,A2) = +0.120..+0.157 R-precision in all 8 (cell, n) combinations (exploratory test 200-279); oracle R-precision 0.96-0.995
    flaw: the oracle receives the exact LP value table V for the test scenarios, so the gap mixes value-function learning with inference. Evidence: A2b (GBM given the EXACT posterior control marginals) is no better than trees on raw observations (+0.00..+0.015). E1 therefore does not show that partial observation creates headroom for structure.
    consequence: FDNA arms are NOT run on the strength of E1. Corrected gate E1b registered below before it is run.
E1b_inference_headroom:   # corrected gate, registered before running
  tier: screen
  claim: partial observation costs a tuned learner measurable accuracy relative to the SAME learner given the exact control vector (isolates inference loss from value-function learning)
  metric: R-precision, same data/cells/n as E1
  arms: GBM on [electrical/physics features + exact control vector] (full information, reference) vs best tuned tree on observations (max of A1, A2)
  inference_headroom: R(exact-c GBM) - R(best obs tree)
  proceed_if: inference_headroom >= 0.03 in at least one cell at n=100 (then the v2 setting is worth testing FDNA arms)
  if_fail: diagnose (observation model too informative: the oracle is near-perfect), then at most two pre-registered harsher variants v2b, v2c below
variants_v2:   # pre-registered before any run; chosen on physical grounds (disaster-time telemetry loss, sparse SCADA coverage); selected/kept using only oracle and tuned tree baselines
  v2b_harsh_telemetry:
    q: [0.5, 0.7]
    s: [0.0, 0.3]
    flags: same 13 flags
  v2c_sparse_coverage:
    q: [0.1, 0.3]
    s: [0.0, 0.2]
    flags: only the 3 gateway heartbeats plus 3 fixed unit poll flags (units 0, 4, 8) are ever observed; other units are never observed
  E1b_inference_headroom_v2:
    status: failed_gate (max headroom +0.0273 [0.0221,0.0325] at q=0.3,s=0.2 < 0.03; other cells -0.0142, +0.0073, -0.0017)
    diagnosis: observations pin down the control state (oracle R-precision 0.96-0.995); partial observation at these levels costs tuned trees almost nothing. Exact-c GBM 0.861 vs best obs tree 0.834-0.875 (tuning noise ~0.015).
    next: pre-registered variants v2b and v2c (registered before running) evaluated on the same gate; v2 stays frozen.

  E1b_variants:
    status: v2b and v2c pass; v2 fails (see prereg/SPEC_V2.md addendum)
    v2b: [+0.0178, +0.0638, +0.0540, +0.1020]   # q=0.5/s=0, q=0.5/s=0.3, q=0.7/s=0, q=0.7/s=0.3
    v2c: [+0.0093, +0.0363, +0.0237, +0.0640]   # q=0.1/s=0, q=0.1/s=0.2, q=0.3/s=0, q=0.3/s=0.2
confirmatory_slots:
  B1_P1_A5_vs_baselines:
    tier: confirm
    cell: v2b q=0.7 s=0.3
    claim: A5 (FDNA belief network) beats the best of A1-A4 by >= 0.05 R-precision (or matches them with 2x fewer training operating points) AND beats A6 and A7
    data: confirm block 400-479, n=25 and n=100 training operating points, 5 replicates, nested-tuned neural arms
    decision: intersection-union; Holm across the declared family
  B1_P2_A5_vs_baselines:
    tier: confirm
    cell: v2c q=0.3 s=0.2
    claim: same as P1
inference_only_branch:   # registered 2026-09-24 ~02:10, before any inference-only code was run
  rationale: end-to-end error is dominated by electrical value-function learning (oracle 0.87-0.99 vs exact-control GBM 0.86); structure can only help the inference part. Isolate it.
  design: learned inference modules map partial observations -> distribution over the 1024 control vectors, trained by cross-entropy on the TRUE control vector using (obs, c) pairs drawn from the generative model (no LP labels needed, so training sizes N in {1e3, 5e3, 2.5e4, 1.25e5}); evaluated by expected shed sum_c p_hat(c) V(op,outage,c) with the EXACT value table (diagnostic use of V; no learner sees it), reporting per-operating-point R-precision, and KL to the exact posterior.
  arms: I1 MLP (1024-way softmax); I2 product-of-per-generator GBMs (4-class each); I3 generic min/max GNN with 1024-way head; I5 FDNA belief network with mean-field per-generator distribution (operabilities -> P(c_g) via independent unit Bernoullis); I6 = I5 with shuffled dependency masks; I7 = I5 with all-ones masks; oracle exact posterior (upper bound). Every arm gets the same 6-trial (lr, weight-decay) search on validation data.
  screen_data: test block 200-279 (exploratory); primary cells P1 (v2b q=0.7 s=0.3), P2 (v2c q=0.3 s=0.2); all 12 cells reported.
  confirmatory_slots:
    INF_P1: {cell: P1, block: confirm 400-479, claim: I5 beats best(I1,I2,I3) by >= 0.05 R-precision at some N <= 5000 (or matches them with 5x fewer samples) AND beats I6 and I7}
    INF_P2: {cell: P2, block: confirm 400-479, claim: same}
  family: confirmatory hypotheses declared so far = B1_P1, B1_P2, INF_P1, INF_P2 (4 of max 8); Holm over these four.
  B1_end_to_end_screen:   # recorded 2026-09-24 ~02:58, exploratory block 200-279, 3 reps, n in {25,100}
    status: killed_as_hypothesis; confirmatory slots B1_P1 and B1_P2 WITHDRAWN and never opened (no look consumed)
    result: A5 minus best(A1-A4) = -0.084/-0.057 (P1, n=25/100) and -0.038/-0.039 (P2); A5 beats shuffled A6 and unconstrained A7 only in P2 (+0.074/+0.052 and +0.062/+0.028); in P1 A5 is not better than A6/A7. Best learnable arm everywhere: A2 (deterministic logic-feature GBM).
    reference_arms: exact-control GBM 0.840/0.871; exact-posterior-marginal-feature GBM 0.757/0.772 (P1), 0.785/0.806 (P2); Bayes oracle 0.865 (P1), 0.912 (P2).
  E1b_definition_flaw:
    finding: E1b (exact-control GBM minus best observation tree) includes irreducible information loss; the reducible inference headroom is R(GBM given exact posterior features) - R(best observation tree) = +0.021/+0.015 (P1, n=25/100) and +0.009/+0.007 (P2), i.e. below 0.03. Better inference cannot help a tree value model by more than ~0.02 on this benchmark.
    consequence: FDNA-as-inference-feature-extractor for trees is bounded at ~+0.02 (hybrid variant not run, bound recorded).
decomposed_branch:   # registered before any decomposed-composition code was written or run
  idea: learning with privileged information from simulation. Learn the value model g(op, outage, control vector) on FULL-information rows (true control vector known in simulation), learn inference p(c | observations) separately on cheap (obs, c) pairs, and compose at test time: prediction = sum_c p_hat(c|obs) g(op, outage, c) over the top-16 posterior vectors. Same LP-labelled row budget as the end-to-end arms.
  arms: D_exact (exact posterior, upper reference, not a competitor); D_I1, D_I2, D_I3, D_I5, D_I6, D_I7 (same g, different learned inference modules trained on N=25,000 (obs,c) samples); end-to-end baselines A1-A7 from the B1 screen.
  screen: block 200-279, cells P1 and P2, n in {25,100}, 3 reps.
  confirmatory_slots:
    D_P1: {cell: P1, block: confirm 400-479, claim: best of D_I* beats best end-to-end arm (A1-A7) by >= 0.05 R-precision at n=25 or n=100}
    D_P2: {cell: P2, same}
    DS_P1: {cell: P1, claim: D_I5 beats best(D_I1, D_I2, D_I3) by >= 0.05 and beats D_I6 and D_I7 (the FDNA-specific claim)}
    DS_P2: {cell: P2, same}
  family_now: INF_P1, INF_P2, D_P1, D_P2, DS_P1, DS_P2 (6 of max 8; B1_P1/B1_P2 withdrawn unopened); Holm over the six.
