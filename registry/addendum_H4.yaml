new_exploratory_arm_registered_before_coding:   # 2026-09-24 ~04:36
  arm: I8_bayes_structure
  idea: FDNA's min/mean operability is a lossy mean-field approximation of belief propagation on the dependency graph. Replace it by an exact differentiable Bayesian layer over the KNOWN structure (14 components, wiring, the two common-cause groups) with LEARNABLE parameters only: per-component failure logits (14), common-cause group logits (2), stale logit (1), initialised at 0.10/0.10/0.10 (deliberately not the true 0.15/0.08/cell-dependent s). Posterior over the 16384 states = softmax(log prior + emission log-likelihood), aggregated to the 1024 control vectors; trained by cross-entropy on the true control vector like the other inference arms.
  hypothesis: with the structure known, only ~17 parameters must be learned, so at N=1000 samples I8 beats the best generic inference module (I1, I2, I3) by >= 0.05 R-precision (expected-shed scoring) in P1 or P2 and approaches the exact posterior; at large N generic modules catch up.
  screen: P1 and P2, N in {1000, 5000, 25000}, 3 reps, arms I1, I2, I3, I5, I8 (+ oracle); primary size N=1000.
  confirm_slots_reserved: INF8_P1, INF8_P2 (of the 2 remaining family slots) - opened only if the screen effect >= 0.05 at N=1000
  scale_caveat: exact enumeration over 2^14 states does not scale to large graphs; the claim is about sample complexity given known structure, not about scale.
outcomes_I8:   # recorded 2026-09-24 ~04:50, exploratory block, 3 reps
  I8_bayes_structure_screen:
    result: KL to the exact posterior 0.021/0.001/0.000 (P1, N=1000/5000/25000) and 0.010/0.002/0.000 (P2) versus generic 0.06-1.8 and FDNA mean-field 1.0-2.8. R-precision (registered expected-shed scoring) I8 minus best generic (I2): -0.019/-0.024/-0.027 (P1), +0.002/-0.015/-0.014 (P2); with P(severe) scoring I8 is within +0.005..+0.011 of the best generic at N=1000 and equals the exact-posterior oracle (0.914-0.916 P1, 0.942-0.943 P2).
    decision: registered hypothesis (I8 beats best generic by >= 0.05 at N=1000) NOT supported; INF8_P1/INF8_P2 not opened. Confirmatory looks consumed: 0.
    interpretation: a near-exact structured posterior (17 learnable parameters) barely changes ranking accuracy relative to a strong per-generator GBM baseline. Since exact inference is the ceiling for ANY structured inference model, the downstream benefit of structure in this benchmark family is at most ~0.01-0.02 R-precision. Value-function learning (learned g versus exact V: 0.09-0.11) dominates the error.
misspecification_sweep:   # registered 2026-09-24 ~05:00 before coding (suggested by the adversarial review)
  question: every structured arm so far had the EXACT structure (inverse-crime setting). Does a structured inference model still help when the assumed dependency wiring is wrong?
  design: I8 (exact differentiable Bayesian layer, 17 learnable parameters) built on an ASSUMED wiring with round(rho*17) wrong edges (rho in {0, 0.1, 0.2, 0.3}, 3 corruption seeds via fdna.wiring.corrupt, unit->generator assignment snapped to the nearest control level), trained on the same (obs, c) draws and scored with the same exact-value-table metrics as the inference screen; compared against the wiring-agnostic generic modules (I1, I2, I3) already run on identical draws. Cells P1, P2; N in {1000, 5000}; primary metric rprec (expected-shed scoring) with rprec_sev secondary.
  hypothesis (exploratory, no confirm slot): structured inference degrades gracefully; there is a corruption level rho* above which the best generic module overtakes I8 at N=1000. Reported as a curve; no threshold claim.
  caveat: assumed structure differs from truth only in gateway->generator parents and unit->generator assignment; common-cause groups and failure priors remain correct (learned).
value_ladder:   # registered 2026-09-24 ~05:05 before coding (suggested by the power-systems review). EXPLORATORY screen on block 200-279.
  question: is the dominant error (value-function learning, exact-control GBM 0.84/0.87 at n=25/100) a feature artifact? Training rows have at most one outage bit set in the 41-bit multi-hot; N-2 test rows have two, so trees extrapolate arbitrarily.
  setting: exact control vector known (no inference), trained on N-1 (+N-0) outages of n in {25,100} training operating points, tested on unseen N-2 pairs (same rows/keys as the other screens); state draws from the v2 prior; R-precision at severity thresholds {0.5%, 1%, 2%, 5%}.
  rungs:
    R0: current features (demand, dispatch, multi-hot outage, n_out, post-outage DC flow/overload block) + exact control vector
    R1: order-invariant outage encoding - drop the multi-hot, add symmetric aggregates (sum/max/min over removed branches of nominal flow ratio, rating, reactance) + n_out; everything else as R0
    R2: R1 + island/headroom features from exact control (per-island deficit and surplus, effective up-/down-headroom min(range*c, Pmax-p0), closed-form shed lower bound)
  metric: R-precision; gap closed at a rung = (R - R0) / (1 - R0), ceiling 1.0 (exact control determines the label exactly).
  kill_rule: if R1 or R2 closes >= 50% of the gap at n=25 in both cells' state draws, the value-learning gap was largely a feature artifact and there is no method contribution in the value learner; if not, the gap is genuine and the dominant open problem stays value learning.
  no_confirm_slot: exploratory only.
outcomes_value_ladder:   # recorded ~05:00, exploratory block, 3 reps
  result: exact-control GBM R-precision on in-distribution N-1 rows is 0.93-0.97, on unseen N-2 pairs 0.79-0.89 (thr 0.5%-5%). R1 (order-invariant outage encoding) and R2 (island/headroom features) do NOT close the gap (gap closed between -0.28 and +0.13; mostly slightly negative).
  decision: kill rule triggered in the other direction - the value-learning gap is NOT a simple feature artifact; it is genuine N-1 -> N-2 extrapolation error under the train-on-N-1 protocol. Rung 4 (N-1 LP features with N-2 few-shot labels) not tested.
outcomes_misspecification_sweep:   # recorded ~05:58, exploratory block, I8 with rho of the 17 edges wrong, 3 corruption seeds
  result: I8 minus best generic (I2 GBM product), expected-shed scoring: exact structure -0.012/-0.026 (P1 N=1000/5000), -0.002/-0.014 (P2); rho=0.1 (2 wrong edges): -0.115/-0.134 (P1), -0.073/-0.086 (P2); rho=0.2: -0.189/-0.195 (P1), -0.198/-0.190 (P2); rho=0.3: -0.205/-0.209 (P1), -0.180/-0.184 (P2); all CIs exclude 0. KL to the exact posterior explodes from 0.001-0.036 to 14-17 (confidently wrong posteriors). With P(severe) scoring the loss is smaller (0.902/0.875/0.880 vs 0.915 exact in P1) but still below the wiring-agnostic modules.
  interpretation: an exact-structure inference model is the ceiling in the friendliest setting (structure exactly right) and is fragile: a 10% wiring error puts it well below wiring-agnostic learners. Structure is a liability unless the wiring is certain.
  caveat: single family of corruptions (gateway->generator parents and unit->generator assignment); priors and common-cause groups kept correct; exploratory.
