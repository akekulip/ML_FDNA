# Phase 3 / Step 1 — diagnostic definitions and gates. Committed BEFORE any Step-1 script is run.
# Status: EXPLORATORY. All screens use already-inspected data (train ops 0-99, test table ops 200-279). No claim can rest on them.
classes:   # disjoint, computed from topology G minus {a,b}; the original grid is one connected component
  connected: 1 component
  gen_less_only: >=2 components, every component except the one containing a generator is generator-less (i.e. all new islands have no generator)
  all_gen: >=2 components, every component contains >=1 generator
  mixed: >=3 components, at least one generator-less and at least two containing generators
  axis_new_2cut: separate boolean axis = pair islands but neither member alone islands (reported, not a class)
error_definition:
  primary: severe rows (y > spec.SEVERE=1%) not among the top-k by prediction, k = #severe in that (op) group, per-op hashed tie-break (evalutil.rprec); "missed-severe mass" = sum of misses per class / total misses
  secondary: MAE per class (regression error, reported separately)
  model: k=0 arm of fewshot (tuned GBM, exact control vector + electrical features, trained on train N-1 rows only, all 100 ops), unseen N-2 rows of test table
gates:
  G1_islanding_concentration: "missed-severe mass in {gen_less_only,all_gen,mixed} >= 50% of total misses" -> Step 3 = island decomposition first; else convex head first. Also report the class's SHARE of N-2 pairs so concentration is read against base rate.
hypotheses_tested_not_assumed:
  H_sub: "y_ab < y_a + y_b (subadditive) frequency; y_ab > y_a + y_b (superadditive) frequency"
  H_lower: "y_ab >= max(y_a,y_b) violation rate"
  H_braess: "y_ab < min(y_a,y_b) i.e. adding an outage REDUCES shed, tolerance 1e-6"
  H_flow_add: "error of naive flow addition f0+D_a+D_b vs exact generalized-LODF post-N-2 flow, connected pairs; report median/95th percentile in %rating"
  fourier: "Walsh/Mobius energy by degree over the 14 comm-component bits, constant excluded, under the actual state prior (v2.sample_states) not the uniform cube; y = value of the FIXED (op,outage); report reconstruction R2 from degree<=1,2,3"
notes:
  - y_0 (base shed) is checked ~0 from train table N-0 rows before m_ab is used.
  - Counts of islanding pairs (143/820 in the agent note) are re-derived here, not assumed.

# --- G1 re-expressed per research-scientist methodology review (relative risk, not bare share) ---
G1_revised:
  statistic: "relative_risk = miss_rate_given_severe(islanding) / miss_rate_given_severe(connected)"
  observed: "islanding 22.0-26.8% vs connected 7.4% -> RR ~3.0-3.6x (STEP1.md item 2, k=0 screen arm)"
  gate: "RR >= 2.0, 90% cluster bootstrap CI (over test operating points) excludes 1.0"
  status: "PASSES directionally on the screen block; CI not yet computed (screen data only, ops 200-279, reused by prior Phase-2 screens per LEDGER.md -> cannot be cited as a fresh confirmatory signal, design guidance only)"
  mass_share_58.9pct: "retained as a DESCRIPTIVE planning quantity (how much of the miss budget a fix must address), not a gate statistic"
