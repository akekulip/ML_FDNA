# H5 AMENDMENT, committed BEFORE the confirm block is opened. Origin: statistician audit of the forking-paths ledger.
status_of_D_claims: D_P1/D_P2 (registered superiority at n=25, comparator best-of-e2e, effect >= 0.05) were NOT sent to the confirm block because the screen effect was below the SESOI. This amendment REPLACES them with ONE pre-named, size-changed claim; it is a post-screen decision and is disclosed as such (the screen effects at n=100 were +0.036/+0.031 for the named arms; n=100 was chosen because n=25 effects were smaller).
what_it_tests: training with simulator-side privileged information (value model g learned on full-information rows; inference learned on cheap (obs, c) pairs; composed over the top-64 posterior vectors) versus the strongest end-to-end baseline that ALSO receives the cheap pairs (A8). It is NOT an FDNA claim.
claim:
  treatment: D_I2_gbm_product
  comparator: A8_hybrid_generic_marginals
  size: n=100 training operating points (N_INF = 25000 cheap pairs)
  cells: [P1 (v2b q=0.7 s=0.3), P2 (v2c q=0.3 s=0.2)]
  block: confirm 400-479, opened once per cell via slots D_P1 / D_P2
  replicates: 5, tuning level: confirm (40 GBM trials, 9-point NN grid), identical for every arm
  family: ONE intersection-union claim (both cells must reject); alpha 0.05, no further adjustment (one composite claim)
tiers:
  tier1_meaningful: mean paired difference >= 0.05 AND margin-test p < 0.05 (H0: mean <= 0.05), in both cells
  tier2_reliable_but_small: margin-test p < 0.05 for H0: mean <= 0, in both cells
  tier3_negligible: 90% two-sided interval inside (-0.02, +0.02) in both cells
statistics: src/fdna/rules.py (two-way bootstrap over test operating points AND training replicates, p floor (1+count)/(B+1), NaNs refused); dry-run on the exploratory block before opening.
what_will_be_said_regardless_of_outcome: results are reported in these tiers; a tier-1 failure is expected from the screen and will be stated as such; the SESOI is not revisited.
dead_claims_not_to_be_opened: INF_P1, INF_P2, DS_P1, DS_P2, INF8_P1, INF8_P2 (null screens). Replicate block 500-579 and reserve 600-699 stay unopened.
outcome_confirm_block:   # recorded 2026-09-24 ~06:10; evaluated with scripts/confirm_D.py exactly as declared above
  P1: {mean_diff: +0.0357, interval90: [+0.0294, +0.0424]}
  P2: {mean_diff: +0.0249, interval90: [+0.0194, +0.0309]}
  joint: tier1 (>= 0.05) NOT supported; tier2 (reliable but small, both cells) SUPPORTED (max p = 1/20001 floor); tier3 (negligible within +-0.02) NOT supported
  reading: training with simulator-side privileged information (decomposition) gives a small, reproducible gain of about +0.025..+0.036 R-precision over the strongest end-to-end baseline that also receives the cheap (obs, c) pairs. Below the pre-declared SESOI. Not an FDNA result (the treatment arm is the generic per-generator GBM inference module).
  locks: registry/locks/confirm__D_P1.lock and confirm__D_P2.lock (commit 3f77a7a; output sha256 recorded)
  next: one replication on block 500-579 (opens replicate__D_P1 / replicate__D_P2), permitted because the claim was confirmed at tier 2.
replicate_rule:   # committed BEFORE the replicate result exists (the replicate parquet did not exist when this was written); added after the closing code review
  same_tiers_same_script: scripts/confirm_D.py replicate, identical tiers and statistics, reported whatever the outcome
  meaning_of_outcomes:
    replicate_supports_tier2_in_both_cells: the tier-2 claim stands as REPLICATED (with the caveat below)
    replicate_fails_tier2_in_either_cell: the tier-2 claim is reported as NOT REPLICATED; no pooling of confirm and replicate; the confirm result is kept as reported
    tier1_or_tier3_on_replicate: reported descriptively; they do not upgrade the claim
  caveat_training_not_independent: the replicate run reuses the confirm run's training draws (they depend only on replicate index and n, not on the block); only the test operating points and the hidden-state/observation draws are fresh, so a successful replicate does not speak to training variability
  caveat_inference_module_confound: the comparator A8 receives marginals from the MLP inference network while the treatment uses the per-generator GBM inference posterior; part of the gap is inference-module choice, not privileged-information decomposition (descriptive contrasts D_I1_mlp vs A8 are reported alongside)
  correction_of_earlier_text: the earlier line 'Replicate block ... stay unopened' was written before the confirm outcome; the replicate block was opened on 2026-09-24 06:05:50 after the tier-2 confirmation, as the outcome_confirm_block entry says
outcome_replicate_block:   # recorded 2026-09-24 ~06:32; the replicate rule above was committed (ff980a1, 06:27:36) before the replicate parquet existed
  P1: {mean_diff: +0.0342, interval90: [+0.0280, +0.0407]}
  P2: {mean_diff: +0.0247, interval90: [+0.0196, +0.0302]}
  joint: tier2 SUPPORTED in both cells (claim stands as REPLICATED); tier1 not supported; tier3 not supported
  caveat: replicate shares the confirm run's training draws (only test operating points and hidden-state/observation draws are fresh); about half of the gap is inference-module choice (D_I1_mlp minus A8 is +0.016/+0.014)
